<style>
:root{--ink:#0a0a0a;--mut:#6b6b6b;--line:#e6e6e6;--soft:#f6f6f6}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:17px/1.55 Outfit,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}header .w{display:flex;align-items:center;gap:14px;height:68px}

.btn.o{background:none;color:var(--ink)}.btn.sm{padding:8px 14px;font-size:13px}.btn:disabled{opacity:.5}
.lg{border:1.5px solid var(--line);background:none;border-radius:99px;padding:8px 14px;font:700 13px Outfit,sans-serif;cursor:pointer;color:var(--ink)}

.lead{color:var(--mut);max-width:38em;margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);margin:30px 0}.stats div{padding:16px 12px 0 0}.stats b{display:block;font:800 34px Outfit,system-ui,sans-serif;letter-spacing:-.04em;line-height:1.1}.stats span{font-size:13px;color:var(--mut)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}.bar .grow{flex:1}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}.tabs button{border:0;background:none;font:600 14px Outfit,sans-serif;padding:9px 20px;border-radius:99px;cursor:pointer;color:var(--mut)}.tabs button.on{background:var(--ink);color:#fff}

.msg{font-size:14px;color:var(--mut);min-height:22px;margin:6px 0 0}

.en{border-top:1px solid var(--line);padding:6px 0}.en>summary,.mo>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;padding:16px 0}.en>summary::-webkit-details-marker{display:none}
.en h3{font-size:23px;letter-spacing:-.03em;line-height:1.2;flex:1}.en .d{color:var(--mut);font-size:14px;white-space:nowrap}.en .n{font-size:12px;font-weight:700;background:var(--soft);padding:3px 10px;border-radius:99px;color:var(--mut)}
.en .bd{padding:0 0 22px}.en h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 8px}.en ul{list-style:none;padding:0}.en li{padding:9px 0;border-bottom:1px solid var(--soft);font-size:16px}.en li:last-child{border:0}

.mh{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:700;margin:34px 0 4px;text-transform:capitalize;letter-spacing:0;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.cm{display:grid;grid-template-columns:64px 74px 1fr auto;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}.cm .d{color:var(--mut);font-size:14px}.cm a.h{font:500 13px ui-monospace,Menlo,monospace;color:var(--mut);text-decoration:none}.cm a.h:hover{color:var(--ink)}.cm b{font-weight:500}.cm details{grid-column:3/5;color:var(--mut);font-size:14px}.cm summary{cursor:pointer;font-size:13px}.cm pre{white-space:pre-wrap;font:inherit;margin-top:6px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--ink);color:#fff;margin-left:8px;vertical-align:2px}.tag.g{background:#1a7f37}
.hid{opacity:.4}

@media(max-width:700px){.w{padding:0 18px}header .w{height:60px}.back{display:none}.stats{grid-template-columns:1fr 1fr}.stats b{font-size:28px}.cm{grid-template-columns:54px 1fr;row-gap:2px}.cm a.h{grid-column:2}.cm b{grid-column:1/3}.cm details{grid-column:1/3}.en h3{font-size:19px}.en>summary{flex-wrap:wrap}.eye{margin-top:36px}.bar{flex-direction:column;align-items:stretch}.tabs{display:flex}.tabs button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:600 13px Outfit,system-ui,sans-serif;cursor:pointer;color:var(--ink)}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(prefers-color-scheme:dark){:root{--ink:#f2f2f2;--mut:#9b9b9b;--line:#262626;--soft:#1a1a1a;color-scheme:dark}body{background:#0a0a0a}header{background:rgba(10,10,10,.86)}.btn,.tag{color:#0a0a0a}.btn.o{color:var(--ink)}.tag.g{color:#fff}.tabs button.on,.chips button.on{color:#0a0a0a}.chips button,input[type=search],.lg{background:#111;color:var(--ink)}}
.hmw{margin:6px 0 4px}.hmt{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600;margin-bottom:8px}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding:4px 2px 8px}.hm{width:13px;height:13px;border-radius:3px;cursor:pointer;background:color-mix(in srgb,var(--ink) calc(var(--l)*23%),var(--soft));transition:opacity .2s}.hm.f{opacity:.18}.hm.sel{outline:2px solid var(--ink);outline-offset:1px}
.ttw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin:16px 0 4px}.ttw label{font-weight:600;font-size:14px}.ttw input{accent-color:var(--ink);width:100%;padding:0;border:0}.ttw span{grid-column:1/3;font-size:14px;color:var(--mut)}
.ib{border:1.5px solid var(--line);background:none;border-radius:9px;padding:2px 9px;font:600 12px Outfit,system-ui,sans-serif;cursor:pointer;color:var(--ink);margin-left:6px;text-transform:none;letter-spacing:0}
</style>

<script>
const GH="https://github.com/adminmossel/MHVwork",$=s=>document.querySelector(s);
const L={nl:{hm:"Activiteit per dag",tt:"Tijdreis",ttl:"Stand op",cmts:"commits",dayc:"Dag",clr:"Wissen",lastc:"Laatste",fa:"Alles",fn:"Nieuw",fo:"Opgelost",fs:"Beveiliging",fw:"Let op",fr:"Verwijderd",back:"← Terug naar de site",eye:"Changelog",h1:"Alles wat er<br>veranderd is.",lead:"companywork is gebouwd op MHVwork. Hier staat de volledige geschiedenis van dat project: elke versie met uitleg en elke commit die ooit is gemaakt, zodat je kunt zien waar elke functie vandaan komt.",commits:"commits",versions:"versies",first:"eerste commit",last:"laatste commit",tv:"Versies",tc:"Alle commits",sync:"Synchroniseren",syncing:"Bezig met ophalen bij GitHub…",synced:"Laatst gesynchroniseerd",uptodate:"Alles is al bijgewerkt.",newc:"nieuwe commits gevonden.",offline:"Geen verbinding met GitHub (of de limiet is bereikt). Probeer het later nog eens.",search:"Zoek in commits…",helpT:"Zo lees je dit",h1t:"Een versie is een stapje vooruit.",h1p:"Elke versie bundelt wat er nieuw, opgelost of veiliger is. Klik op een versie om te zien wat er precies veranderd is.",h2t:"Een commit is één opgeslagen wijziging.",h2p:"Elke keer dat de code wordt opgeslagen ontstaat er een commit, met een datum en een korte titel. Alle commits samen vormen de volledige geschiedenis.",h3t:"Symbolen",h3p:"✨ nieuw · 🐞 opgelost · 🔒 beveiliging · ⚠️ let op bij het updaten · 🗑️ verwijderd.",h4t:"Synchronisatie",h4p:"Deze pagina wordt elke dag automatisch gelijkgetrokken met MHVwork. Met de knop Synchroniseren haal je nu meteen de nieuwste commits op.",full:"Volledige beschrijving",more:"meer",nocm:"Niets gevonden.",own:"eigen",nw:"nieuw",ft:"© 2026 companywork · Made in Meppel",vw:"Voorwaarden & privacy",items:"punten"},
en:{hm:"Activity per day",tt:"Time travel",ttl:"State on",cmts:"commits",dayc:"Day",clr:"Clear",lastc:"Latest",fa:"All",fn:"New",fo:"Fixed",fs:"Security",fw:"Note",fr:"Removed",back:"← Back to the site",eye:"Changelog",h1:"Everything that<br>has changed.",lead:"companywork is built on MHVwork. This is the complete history of that project: every version explained and every commit ever made, so you can see where each feature comes from. The changelog content itself is in Dutch.",commits:"commits",versions:"versions",first:"first commit",last:"latest commit",tv:"Versions",tc:"All commits",sync:"Synchronise",syncing:"Fetching from GitHub…",synced:"Last synchronised",uptodate:"Everything is already up to date.",newc:"new commits found.",offline:"No connection to GitHub (or the limit was reached). Please try again later.",search:"Search commits…",helpT:"How to read this",h1t:"A version is a step forward.",h1p:"Each version bundles what is new, fixed or more secure. Click a version to see exactly what changed.",h2t:"A commit is one saved change.",h2p:"Every time the code is saved a commit is created, with a date and a short title. All commits together form the complete history.",h3t:"Symbols",h3p:"✨ new · 🐞 fixed · 🔒 security · ⚠️ note when updating · 🗑️ removed.",h4t:"Synchronisation",h4p:"This page is matched with MHVwork automatically every day. The Synchronise button fetches the newest commits right now.",full:"Full description",more:"more",nocm:"Nothing found.",own:"own",nw:"new",ft:"© 2026 companywork · Made in Meppel",vw:"Terms & privacy",items:"points"}};
let lg=localStorage.getItem("cw-lang")||(/^en/i.test(navigator.language)?"en":"nl"),D,E0,E,view="v",q="",msg="",ft="",op="",dayf="",upto="";
const t=k=>L[lg][k]??k,clone=o=>JSON.parse(JSON.stringify(o)),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\s][^*]*)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,u)=>`<a href="${/^https?:/.test(u)?u:GH+"/blob/main/"+u.replace(/^\.?\//,"")}" target="_blank" rel="noopener">${a}</a>`);
const fmt=(d,o)=>new Date(d+(d.length==10?"T12:00:00":"")).toLocaleDateString(lg=="en"?"en-GB":"nl-NL",o);
const ttl=(k,o)=>E.titles[k]||o,isH=k=>E.hidden.includes(k);
function entries(){const man=E.manual.filter(x=>x.kind=="entry").map(x=>({id:x.id,title:x.t,date:fmt(x.d,{month:"long",year:"numeric"}),groups:[{name:"",items:x.b.split("\n").filter(Boolean)}],intro:[],own:1,del:x.id}));return man.concat(D.entries.map(e=>({...e,key:"e:"+e.id})))}
function commits(){const man=E.manual.filter(x=>x.kind=="commit").map(x=>({h:x.id,full:"",d:x.d,t:x.t,b:x.b,own:1,del:x.id}));return man.concat(D.commits).sort((a,b)=>b.d.localeCompare(a.d))}
const FT={n:/✨/,o:/🐞|✅|🐛/,s:/🔒|🚨/,w:/⚠|ℹ|🔧/,r:/🗑/};
const vlink=c=>{const m=c.t.match(/\bv\.?\s?(\d+\.\d+)/i);if(!m)return"";const e=D.entries.find(x=>new RegExp("versie "+m[1].replace(".","\\.")+"(?!\\d)","i").test(x.title));return e?`<a class="vt" href="#en-${e.id}" data-a="gv:${e.id}">v${m[1]} →</a>`:""};
function vEntries(){const all=entries(),f0=Math.max(0,all.findIndex(x=>!x.own)),out=all.map((e,i)=>{const k=e.key||e.id;if(isH(k))return"";const gs=ft?e.groups.filter(g=>FT[ft].test(g.name)):e.groups;if(ft&&!gs.length)return"";const n=gs.reduce((a,g)=>a+g.items.length,0);
 return`<details class="en" id="en-${e.id}" ${op?(e.id==op?"open":""):(ft||i==f0?"open":"")}><summary><h3>${esc(ttl(k,e.title))}${e.own?`<span class="tag">${t("own")}</span>`:""}</h3><span class="d">${esc(e.date||"")}</span>${n?`<span class="n">${n} ${t("items")}</span>`:""}</summary><div class="bd">${(e.intro||[]).map(p=>`<p>${md(p)}</p>`).join("")}${gs.map(g=>`${g.name?`<h4>${esc(g.name)}</h4>`:""}<ul>${g.items.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`).join("")}${e.doc?`<p style="margin-top:14px"><a href="${GH}/blob/main/${e.doc}" target="_blank" rel="noopener">${t("full")} (${esc(e.doc)}) ↗</a></p>`:""}</div></details>`}).join("");
 return`<div class="chips">${[["","fa"],["n","fn"],["o","fo"],["s","fs"],["w","fw"],["r","fr"]].map(c=>`<button class="${ft==c[0]?"on":""}" data-a="ft:${c[0]}">${t(c[1])}</button>`).join("")}</div>`+(out.trim()?out:`<p class="lead">${t("nocm")}</p>`)}
function vCommits(){const ql=q.toLowerCase(),L2=commits().filter(c=>!isH(c.h)&&(!dayf||c.d==dayf)&&(!upto||c.d<=upto)&&(!ql||(c.t+" "+(c.b||"")+" "+c.h).toLowerCase().includes(ql)));if(!L2.length)return`<p class="lead" style="margin-top:30px">${t("nocm")}</p>`;let m="",o="";
 for(const c of L2){const mo=fmt(c.d,{month:"long",year:"numeric"});if(mo!=m){m=mo;o+=`<div class="mh">${esc(mo)}</div>`}
  o+=`<div class="cm ${isH(c.h)?"hid":""}"><span class="d">${fmt(c.d,{day:"numeric",month:"short"})}</span>${c.full?`<a class="h" href="${GH}/commit/${c.full}" target="_blank" rel="noopener">${c.h}</a>`:`<span class="tag">${t("own")}</span>`}<b>${esc(ttl(c.h,c.t))}${vlink(c)}${c.nw?`<span class="tag g">${t("nw")}</span>`:""}</b>${c.b?`<details><summary>${t("more")}</summary><pre>${esc(c.b)}</pre></details>`:""}</div>`}return o}

function dates(){return[...new Set(D.commits.map(c=>c.d))].sort()}
function heat(){const cs=D.commits,cnt={};cs.forEach(c=>cnt[c.d]=(cnt[c.d]||0)+1);const ds=dates(),a=new Date(ds[0]+"T12:00:00"),z=new Date(ds[ds.length-1]+"T12:00:00"),mx=Math.max(...Object.values(cnt));a.setDate(a.getDate()-((a.getDay()+6)%7));let o="";
 for(let d=new Date(a);d<=z;d.setDate(d.getDate()+1)){const k=d.toISOString().slice(0,10),n=cnt[k]||0;o+=`<i class="hm${upto&&k>upto?" f":""}${dayf==k?" sel":""}" data-a="hd:${k}" data-d="${k}" title="${k}: ${n}" style="--l:${n?Math.ceil(n/mx*4):0}"></i>`}
 return`<div class="hmw"><div class="hmt">${t("hm")}${dayf?` · ${t("dayc")} ${esc(dayf)} <button class="ib" data-a="hd:">${t("clr")}</button>`:""}</div><div class="heat" id="heat">${o}</div></div>`}
function slider(){const ds=dates(),i=upto?ds.indexOf(upto):ds.length-1;return`<div class="ttw"><label for="tt">${t("tt")}</label><input type="range" id="tt" min="0" max="${ds.length-1}" value="${i}"><span id="ttv">${ttLabel(ds[i])}</span></div>`}
function ttLabel(d){const n=D.commits.filter(c=>c.d<=d).length,l=D.commits.filter(c=>c.d<=d).sort((a,b)=>b.d.localeCompare(a.d))[0];return`${t("ttl")} ${fmt(d,{day:"numeric",month:"short",year:"numeric"})}: ${n} ${t("cmts")}${l?` · ${t("lastc")}: ${esc(l.t)}`:""}`}
function render(){document.documentElement.lang=lg;$("#lg").textContent=lg=="nl"?"EN":"NL";$("#bk").textContent=t("back");$("#ft").textContent=t("ft");$("#vw").textContent=t("vw");document.title="Changelog — companywork";
 if(!D){$("#app").innerHTML="";return}const cs=D.commits,ds=cs.map(c=>c.d).sort();
 $("#app").className="w";
 $("#app").innerHTML=`<div class="eye">${t("eye")}</div><h1>${t("h1")}</h1><p class="lead">${t("lead")}</p>
 <div class="stats"><div><b>${cs.length}</b><span>${t("commits")}</span></div><div><b>${D.entries.length}</b><span>${t("versions")}</span></div><div><b>${fmt(ds[0],{month:"short",year:"numeric"})}</b><span>${t("first")}</span></div><div><b>${fmt(ds[ds.length-1],{day:"numeric",month:"short"})}</b><span>${t("last")}</span></div></div>
 ${heat()}<details class="help"><summary>${t("helpT")}</summary><ul><li><b>${t("h1t")}</b> ${t("h1p")}</li><li><b>${t("h2t")}</b> ${t("h2p")}</li><li><b>${t("h3t")}.</b> ${t("h3p")}</li><li><b>${t("h4t")}.</b> ${t("h4p")}</li></ul></details>
 <div class="bar"><div class="tabs"><button class="${view=="v"?"on":""}" data-a="vw:v">${t("tv")}</button><button class="${view=="c"?"on":""}" data-a="vw:c">${t("tc")} (${cs.length})</button></div><span class="grow"></span><button class="btn sm o" data-a="sy">${t("sync")}</button><a class="btn sm o" href="changelog.xml">RSS</a></div>
 <p class="msg" id="ms">${esc(msg)||t("synced")+": "+fmt(D.synced.slice(0,10),{day:"numeric",month:"long",year:"numeric"})}</p>
 ${view=="c"?`<input type="search" id="q" placeholder="${t("search")}" value="${esc(q)}" style="margin:14px 0 4px">`:""}
