name: Sync changelog met MHVwork
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-changelog.mjs
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git config user.name "companywork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add changelog-data.json
          git diff --staged --quiet || (git commit -m "Sync changelog met MHVwork" && git push)
